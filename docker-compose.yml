services:
  postgres:
    image: postgres:16-alpine
    container_name: pdfmind-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pdfmind
      POSTGRES_PASSWORD: pdfmind
      POSTGRES_DB: pdfmind
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pdfmind-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pdfmind-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://pdfmind:pdfmind@postgres:5432/pdfmind
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - postgres
      - api

volumes:
  pgdata:
